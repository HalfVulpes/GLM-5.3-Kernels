[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glm53-sm80-kernels"
version = "0.1.0"
description = "Shape-specialized Triton INT8 sparse MLA and MoE routing kernels for GLM-5.3 on SM80"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch", "triton"]

[project.urls]
Repository = "https://github.com/HalfVulpes/GLM-5.3-Kernels"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
package-dir = {"" = "kernels"}
py-modules = ["titan_kv", "titan_mla", "titan_moe_align"]
